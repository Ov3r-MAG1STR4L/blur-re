<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFS Studio</title>
<style>
  :root { --bg:#14161a; --panel:#1f232a; --txt:#e8eaed; --muted:#9aa0a6; --acc:#3d8bfd; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt); font:13px system-ui, sans-serif; }
  #app { display:grid; grid-template-columns:300px 1fr; height:100%; }
  #side { background:var(--panel); padding:10px; overflow:auto; }
  #view { position:relative; overflow:hidden; }
  canvas { display:block; }
  h2 { font-size:12px; margin:14px 0 6px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  button, select, input { font:inherit; color:var(--txt); background:#2b3039; border:1px solid #3a404b; border-radius:5px; padding:4px 7px; margin:2px 0; }
  button:hover { border-color:var(--acc); }
  button.on { background:var(--acc); border-color:var(--acc); }
  button:disabled { opacity:.4; }
  label { display:block; margin:2px 0; }
  .row { display:flex; gap:4px; flex-wrap:wrap; align-items:center; }
  input[type=number] { width:70px; }
  #hud { position:absolute; left:10px; bottom:10px; background:#000a; padding:6px 9px; border-radius:6px; pointer-events:none; }
  #help { position:absolute; inset:30px; background:#111e; border:1px solid #444; border-radius:10px; padding:20px 28px; overflow:auto; display:none; line-height:1.5; }
  #log { height:130px; overflow:auto; background:#0e1013; font:11px monospace; padding:4px; white-space:pre-wrap; }
  #busy { position:absolute; top:10px; left:50%; transform:translateX(-50%); background:#000c; padding:8px 14px; border-radius:6px; display:none; }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <div class="row"><button id="undo" title="Ctrl+Z">↶ Annuler</button><button id="redo" title="Ctrl+Y">↷ Rétablir</button>
      <button id="save" title="Ctrl+S">Enregistrer</button><button id="helpBtn">Didacticiel</button></div>
    <h2>1. Lieu</h2>
    <select id="loc" style="width:100%"></select>
    <button id="loadBtn">Charger le lieu</button>
    <h2>2. Circuit</h2>
    <div class="row"><button data-mode="main">Tracé principal</button><button data-mode="branch">Chemin secondaire</button></div>
    <div class="row"><button id="newBranch">Nouveau chemin</button><button id="valid">Valider le circuit ➜</button></div>
    <div class="row"><button id="autoW" title="recentre sur l'asphalte et donne à chaque point la largeur réelle de la route (couloir des IA)">Recaler + largeurs auto</button></div>
    <div class="row"><button id="clrMain">Effacer le tracé</button><button id="clrBranch">Effacer le chemin choisi</button><button id="clrAll">Effacer tous les chemins</button></div>
    <label>Largeur du point choisi (m) <input id="pw" type="number" step="1" min="6" max="120"></label>
    <h2>3. Bonus et départ</h2>
    <div class="row"><button data-mode="bonus" class="needv">Bonus Blur</button><button data-mode="start" class="needv">Départ</button></div>
    <div class="row"><button id="hpBonus" class="needv">Bonus aux emplacements HP</button><button id="clrBonus" class="needv">Retirer les bonus</button></div>
    <h2>Vue</h2>
    <div class="row"><button data-mode="look">Regarder</button><button id="top">Vue de dessus</button><button id="persp">Vue 3D</button></div>
    <label><input type="checkbox" id="l_decor" checked> Bâtiments / décor</label>
    <label><input type="checkbox" id="l_route" checked> Route</label>
    <label><input type="checkbox" id="l_tex" checked> Textures</label>
    <label><input type="checkbox" id="l_hit"> Hitbox de la route (surface roulable)</label>
    <label><input type="checkbox" id="l_ai" checked> Trajet IA et largeurs</label>
    <label><input type="checkbox" id="l_bonus" checked> Bonus (HP orange, Blur bleu)</label>
    <h2>4. Construction</h2>
    <label>Largeur par défaut (m) <input id="o_width" type="number" value="50"></label>
    <label>Tours <input id="o_laps" type="number" value="3"></label>
    <label>Recul de la grille (m) <input id="o_grid" type="number" value="25"></label>
    <label>Rayon du décor (m) <input id="o_radius" type="number" value="300"></label>
    <label>Distance d'affichage (m) <input id="o_draw" type="number" value="700"></label>
    <label>Zones (m) <input id="o_zone" type="number" value="200"></label>
    <label>Lumière propre (0-255) <input id="o_glow" type="number" value="110"></label>
    <div class="row"><button id="build" class="needv">Construire</button><button id="install">Installer dans Blur_test</button></div>
    <h2>Journal</h2>
    <div id="log"></div>
  </div>
  <div id="view">
    <div id="hud">—</div>
    <div id="busy">Chargement…</div>
    <div id="help"></div>
  </div>
</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = id => document.getElementById(id);
$('help').innerHTML = `<h2 style="color:#fff">NFS Studio — didacticiel</h2>
<b>1. Lieu</b> : choisis un lieu Hot Pursuit puis « Charger le lieu » (la 1re fois, l'export prend une minute environ).<br>
<b>Navigation</b> : clic gauche glissé = tourner (mode Regarder), clic droit glissé = déplacer, molette = zoom.
« Vue de dessus » pour tracer vite, « Vue 3D » pour corriger. La barre du bas donne x, z et la hauteur sous la souris.<br><br>
<b>2. Circuit</b> — mode <i>Tracé principal</i> :<br>
• clic sur la route = ajouter un point à la fin (sens de la course) ; la boucle se referme seule ;<br>
• <b>Maj + clic</b> = insérer un point dans le segment le plus proche ;<br>
• glisser une boule = déplacer le point (il reste collé à la surface, la hauteur suit) ;<br>
• clic sur une boule puis <b>Suppr</b> = la retirer ; « Largeur du point choisi » = largeur de la route à cet endroit
(le ruban rouge transparent la montre).<br>
Mode <i>Chemin secondaire</i> : « Nouveau chemin », puis clics du départ (près du tracé) jusqu'au retour (près du tracé).
Mêmes gestes pour déplacer / insérer / supprimer.<br>
« Valider le circuit » débloque l'étape 3.<br><br>
<b>3. Bonus et départ</b> : mode <i>Bonus Blur</i> : clic sur la route = une rangée de bonus (cube bleu) ; clic sur un cube
puis Suppr = le retirer. Les anneaux orange sont les anciens bonus de Hot Pursuit. Mode <i>Départ</i> : clic = ligne de départ.<br><br>
<b>4. Construction</b> : réglages, « Construire » (plusieurs minutes, suivi dans le journal), puis « Installer dans Blur_test »
(Blur fermé). En jeu : course perso, lieu « NFS … ».<br><br>
Calques : décor, route, textures, <b>hitbox</b> (surface roulable en vert), trajet IA + largeurs, bonus.<br>
Raccourcis : Ctrl+Z annuler, Ctrl+Y rétablir, Ctrl+S enregistrer, Suppr supprimer, Échap désélectionner.<br><br>
<button onclick="this.parentNode.style.display='none'">Fermer</button>`;
$('helpBtn').onclick = () => $('help').style.display = 'block';

// ---------- scène ----------
const view = $('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
view.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fb4d8);
const camera = new THREE.PerspectiveCamera(55, 1, 1, 20000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.screenSpacePanning = true;
const layers = { decor: new THREE.Group(), route: new THREE.Group(), hit: new THREE.Group(), ai: new THREE.Group(),
                 bonus: new THREE.Group(), handles: new THREE.Group() };
Object.values(layers).forEach(g => scene.add(g));
function resize() { const r = view.getBoundingClientRect(); renderer.setSize(r.width, r.height); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

// ---------- état + annuler ----------
let S = { points: [], branches: [], pickups: [], start: null, validated: false };   // points : {x,y,z,w}
let undoS = [], redoS = [], mode = 'look', curBranch = -1, sel = null, info = null, topView = false;
const snap = () => JSON.stringify([S, curBranch]);
function push() { undoS.push(snap()); if (undoS.length > 300) undoS.shift(); redoS = []; }
function restore(s) { [S, curBranch] = JSON.parse(s); sel = null; refresh(); }
$('undo').onclick = () => { if (undoS.length) { redoS.push(snap()); restore(undoS.pop()); } };
$('redo').onclick = () => { if (redoS.length) { undoS.push(snap()); restore(redoS.pop()); } };

function setMode(m) {
  if ((m === 'bonus' || m === 'start') && !S.validated) { say('valide d\'abord le circuit (étape 2)'); return; }
  mode = m; controls.enableRotate = m === 'look';
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
}
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));
$('top').onclick = () => { topView = true; const t = controls.target; camera.position.set(t.x, t.y + 1500, t.z + 0.01); };
$('persp').onclick = () => { topView = false; const t = controls.target; camera.position.set(t.x + 400, t.y + 350, t.z + 400); };

// ---------- journal ----------
function say(m) { const l = $('log'); l.textContent += m + '\n'; l.scrollTop = 1e9; }
let lastLog = 0;
setInterval(async () => { try { const L = await (await fetch('/api/log')).json();
  if (L.length !== lastLog) { $('log').textContent = L.join('\n') + '\n'; $('log').scrollTop = 1e9; lastLog = L.length; } } catch (e) {} }, 1500);

// ---------- chargement du lieu ----------
async function locations() {
  const r = await (await fetch('/api/locations')).json();
  $('loc').innerHTML = r.all.map(p => `<option ${p === r.current ? 'selected' : ''} value="${p}">${p.split(/[\\/]/).slice(-2).join('/')}</option>`).join('');
}
const texLoader = new THREE.TextureLoader();
const grayR = new THREE.MeshBasicMaterial({ color: 0x606060, side: THREE.DoubleSide });
const grayD = new THREE.MeshBasicMaterial({ color: 0xc8c8c8, side: THREE.DoubleSide });
async function loadLocation() {
  $('busy').style.display = 'block'; $('busy').textContent = 'Export / chargement du lieu… (la 1re fois : environ une minute)';
  const r = await (await fetch('/api/load?stm=' + encodeURIComponent($('loc').value))).json();
  if (r.error) { $('busy').textContent = 'Erreur : ' + r.error; return; }
  info = await (await fetch(`/cache/${r.stem}/index.json`)).json();
  for (const g of [layers.decor, layers.route, layers.hit]) g.clear();
  const mats = info.textures.map((t, i) => {
    if (t.startsWith('couleur:')) return new THREE.MeshBasicMaterial({ color: '#' + t.slice(8), side: THREE.DoubleSide });
    const tx = texLoader.load(`/cache/${r.stem}/t${String(i).padStart(3, '0')}.png`);
    tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.colorSpace = THREE.SRGBColorSpace;
    return new THREE.MeshBasicMaterial({ map: tx, side: THREE.DoubleSide, alphaTest: 0.3 });
  });
  const hitMat = new THREE.MeshBasicMaterial({ color: 0x00ff66, transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false });
  let n = 0;
  await Promise.all(info.chunks.map(async c => {
    const buf = new Float32Array(await (await fetch(`/cache/${r.stem}/${c.file}`)).arrayBuffer());
    const g = new THREE.BufferGeometry(), N = buf.length / 5, P = new Float32Array(N * 3), U = new Float32Array(N * 2);
    for (let i = 0; i < N; i++) { P[3*i] = buf[5*i]; P[3*i+1] = buf[5*i+1]; P[3*i+2] = buf[5*i+2]; U[2*i] = buf[5*i+3]; U[2*i+1] = buf[5*i+4]; }
    g.setAttribute('position', new THREE.BufferAttribute(P, 3)); g.setAttribute('uv', new THREE.BufferAttribute(U, 2));
    g.computeBoundingSphere(); g.computeBoundingBox();
    const mesh = new THREE.Mesh(g, mats[c.tex]); mesh.userData.mat = mats[c.tex];
    layers[c.layer].add(mesh);
    if (c.layer === 'route') layers.hit.add(new THREE.Mesh(g, hitMat));
    n += N / 3;
  }));
  layers.bonus.clear();
  for (const [x, y, z] of info.hp_pickups) {
    const m = new THREE.Mesh(new THREE.TorusGeometry(5, 1.2, 8, 24), new THREE.MeshBasicMaterial({ color: 0xff9900 }));
    m.position.set(x, y + 3, z); m.rotation.x = Math.PI / 2; m.userData.hp = true; layers.bonus.add(m);
  }
  await loadWorld();
  const box = new THREE.Box3().setFromObject(layers.route); const c = box.getCenter(new THREE.Vector3());
  controls.target.copy(c); camera.position.set(c.x + 900, c.y + 900, c.z + 900);
  $('busy').style.display = 'none';
  say(`lieu chargé : ${Math.round(n)} triangles, ${info.textures.length} textures, ${info.hp_pickups.length} anciens bonus HP`);
  applyLayers();
}
$('loadBtn').onclick = loadLocation;

async function loadWorld() {
  const w = await (await fetch('/api/world')).json();
  S = { points: [], branches: [], pickups: [], start: null, validated: false }; undoS = []; redoS = []; curBranch = -1; sel = null;
  if (w) {
    const mp = w.locations[0].maps[0], def = mp.width || +$('o_width').value;
    S.points = (mp.points || []).map(p => ({ x: p.x, z: p.z, y: (p.h || 0) + 1, w: p.w || def }));
    S.branches = (mp.branches || []).map(b => b.points.map(p => ({ x: p.x, z: p.z, y: (p.h || 0) + 1, w: p.w || b.width || 30 })));
    S.pickups = (mp.pickups || []).map(p => ({ x: p.x, z: p.z, y: groundAt(p.x, p.z) }));
    S.validated = S.points.length > 2;
    if (mp.start_m != null && S.points.length) S.start = pointAt(mp.start_m);
    $('o_laps').value = mp.laps || 3;
  }
  refresh();
}

// ---------- géométrie du tracé ----------
const lens = pts => { const L = [0]; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; L.push(L[i] + Math.hypot(b.x - a.x, b.z - a.z)); } return L; };
function pointAt(s) { const L = lens(S.points); s %= L[L.length - 1];
  for (let i = 0; i < S.points.length; i++) if (L[i + 1] >= s) { const a = S.points[i], b = S.points[(i + 1) % S.points.length], t = (s - L[i]) / (L[i + 1] - L[i] || 1);
    return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, z: a.z + (b.z - a.z) * t }; }
  return { ...S.points[0] }; }
function arc(p) { const L = lens(S.points); let k = 0, d = 1e18; S.points.forEach((q, i) => { const e = Math.hypot(q.x - p.x, q.z - p.z); if (e < d) { d = e; k = i; } }); return L[k]; }
function ribbon(pts, closed, color) {
  const n = pts.length; if (n < 2) return null;
  const P = [], idx = [];
  for (let i = 0; i < n; i++) {
    const a = pts[closed ? (i - 1 + n) % n : Math.max(i - 1, 0)], b = pts[closed ? (i + 1) % n : Math.min(i + 1, n - 1)];
    let dx = b.x - a.x, dz = b.z - a.z; const l = Math.hypot(dx, dz) || 1; dx /= l; dz /= l;
    const h = pts[i].w / 2; P.push(pts[i].x - dz * h, pts[i].y + 0.4, pts[i].z + dx * h, pts[i].x + dz * h, pts[i].y + 0.4, pts[i].z - dx * h);
  }
  for (let i = 0; i < (closed ? n : n - 1); i++) { const j = (i + 1) % n; idx.push(2*i, 2*j, 2*i+1, 2*i+1, 2*j, 2*j+1); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3)); g.setIndex(idx);
  return new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.28, side: THREE.DoubleSide, depthWrite: false }));
}
function line(pts, closed, color) {
  const v = pts.map(p => new THREE.Vector3(p.x, p.y + 0.6, p.z)); if (closed && v.length) v.push(v[0].clone());
  return new THREE.Line(new THREE.BufferGeometry().setFromPoints(v), new THREE.LineBasicMaterial({ color }));
}
const ball = (p, color, r = 2.2) => { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 8), new THREE.MeshBasicMaterial({ color })); m.position.set(p.x, p.y + 1, p.z); return m; };

function refresh() {
  layers.ai.clear(); layers.handles.clear();
  [...layers.bonus.children].filter(m => !m.userData.hp).forEach(m => layers.bonus.remove(m));
  if (S.points.length > 1) { layers.ai.add(line(S.points, true, 0xff2020)); layers.ai.add(ribbon(S.points, true, 0xff3030)); }
  S.branches.forEach(b => { if (b.length > 1) { layers.ai.add(line(b, false, 0xb040ff)); layers.ai.add(ribbon(b, false, 0xb040ff)); } });
  S.points.forEach((p, i) => { const m = ball(p, sel && sel.kind === 'main' && sel.i === i ? 0xffff00 : 0xff2020); m.userData.h = { kind: 'main', i }; layers.handles.add(m); });
  S.branches.forEach((b, k) => b.forEach((p, i) => { const m = ball(p, sel && sel.kind === 'branch' && sel.k === k && sel.i === i ? 0xffff00 : (k === curBranch ? 0xd080ff : 0x9030e0)); m.userData.h = { kind: 'branch', k, i }; layers.handles.add(m); }));
  S.pickups.forEach((p, i) => { const m = new THREE.Mesh(new THREE.BoxGeometry(6, 6, 6), new THREE.MeshBasicMaterial({ color: sel && sel.kind === 'pickup' && sel.i === i ? 0xffff00 : 0x2b7bff }));
    m.position.set(p.x, p.y + 3, p.z); m.userData.h = { kind: 'pickup', i }; layers.bonus.add(m); });
  if (S.start) { const m = ball(S.start, 0x00cc44, 4); m.userData.h = { kind: 'start' }; layers.handles.add(m); }
  document.querySelectorAll('.needv').forEach(b => b.disabled = !S.validated);
  const p = selPoint(); $('pw').value = p ? p.w : '';
  hudStats();
  applyLayers();
}
let hudPos = '';
function hudStats() { const L = S.points.length > 1 ? lens(S.points).at(-1) : 0;
  $('hud').textContent = `${S.points.length} points · ${(L / 1000).toFixed(2)} km · ${S.branches.length} chemins · ${S.pickups.length} bonus`
    + (S.validated ? '' : ' · circuit non validé') + (hudPos ? ' | ' + hudPos : ''); }
function selPoint() { if (!sel) return null; if (sel.kind === 'main') return S.points[sel.i]; if (sel.kind === 'branch') return S.branches[sel.k][sel.i]; return null; }
$('pw').onchange = () => { const p = selPoint(); if (p) { push(); p.w = +$('pw').value; refresh(); } };

function applyLayers() {
  layers.decor.visible = $('l_decor').checked; layers.route.visible = $('l_route').checked; layers.hit.visible = $('l_hit').checked;
  layers.ai.visible = $('l_ai').checked; layers.bonus.visible = $('l_bonus').checked;
  const tex = $('l_tex').checked;
  for (const g of [layers.decor, layers.route]) g.children.forEach(m => { m.material = tex ? m.userData.mat : (g === layers.route ? grayR : grayD); });
}
['l_decor', 'l_route', 'l_tex', 'l_hit', 'l_ai', 'l_bonus'].forEach(id => $(id).onchange = applyLayers);

// ---------- souris ----------
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
function cast(e, objs) { const r = renderer.domElement.getBoundingClientRect(); mouse.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1); ray.setFromCamera(mouse, camera); return ray.intersectObjects(objs, true); }
function surface(e) { const h = cast(e, layers.route.children); if (h.length) return h[0].point;
  const p = new THREE.Vector3(); return ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), -1), p) ? p : null; }
function groundAt(x, z) { ray.set(new THREE.Vector3(x, 3000, z), new THREE.Vector3(0, -1, 0)); const h = ray.intersectObjects(layers.route.children, true); return h.length ? h[0].point.y : 1; }
let dragging = null, lastMove = 0;
renderer.domElement.addEventListener('pointerdown', e => {
  if (e.button !== 0 || mode === 'look') return;
  const h = cast(e, [...layers.handles.children, ...layers.bonus.children.filter(m => !m.userData.hp)]);
  if (h.length && h[0].object.userData.h) { sel = h[0].object.userData.h; if (sel.kind === 'branch') curBranch = sel.k;
    push(); dragging = sel; controls.enabled = false; refresh(); return; }
  const p = surface(e); if (!p) return;
  const q = { x: p.x, y: p.y, z: p.z, w: +$('o_width').value };
  if (mode === 'main') { push(); if (e.shiftKey && S.points.length > 1) insertNear(S.points, q, true); else S.points.push(q); S.validated = false; }
  else if (mode === 'branch') { if (curBranch < 0) { say('clique d\'abord sur « Nouveau chemin »'); return; } push(); q.w = 30;
    const b = S.branches[curBranch]; if (e.shiftKey && b.length > 1) insertNear(b, q, false); else b.push(q); }
  else if (mode === 'bonus') { push(); S.pickups.push({ x: p.x, y: p.y, z: p.z }); }
  else if (mode === 'start') { push(); S.start = { x: p.x, y: p.y, z: p.z }; }
  refresh();
});
addEventListener('pointerup', () => { if (dragging) { dragging = null; controls.enabled = true; refresh(); } });
renderer.domElement.addEventListener('pointermove', e => {
  const now = performance.now(); if (!dragging && now - lastMove < 80) return; lastMove = now;
  const p = surface(e);
  if (p) { hudPos = `x ${p.x.toFixed(1)}  z ${p.z.toFixed(1)}  hauteur ${p.y.toFixed(1)} m`; if (!dragging) hudStats(); }
  if (!dragging || !p) return;
  const t = dragging.kind === 'main' ? S.points[dragging.i] : dragging.kind === 'branch' ? S.branches[dragging.k][dragging.i]
          : dragging.kind === 'pickup' ? S.pickups[dragging.i] : S.start;
  t.x = p.x; t.y = p.y; t.z = p.z; if (dragging.kind === 'main') S.validated = false;
  refresh();
});
function insertNear(pts, q, closed) { let k = 0, d = 1e18; const n = pts.length;
  for (let i = 0; i < (closed ? n : n - 1); i++) { const a = pts[i], b = pts[(i + 1) % n];
    const e = Math.hypot((a.x + b.x) / 2 - q.x, (a.z + b.z) / 2 - q.z); if (e < d) { d = e; k = i; } }
  q.w = (pts[k].w + pts[(k + 1) % n].w) / 2; pts.splice(k + 1, 0, q); }
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.ctrlKey && e.key === 'z') { $('undo').onclick(); e.preventDefault(); }
  else if (e.ctrlKey && e.key === 'y') { $('redo').onclick(); e.preventDefault(); }
  else if (e.ctrlKey && e.key === 's') { save(); e.preventDefault(); }
  else if (e.key === 'Escape') { sel = null; refresh(); }
  else if (e.key === 'Delete' && sel) { push();
    if (sel.kind === 'main') { S.points.splice(sel.i, 1); S.validated = false; }
    else if (sel.kind === 'branch') { S.branches[sel.k].splice(sel.i, 1); if (!S.branches[sel.k].length) { S.branches.splice(sel.k, 1); curBranch = -1; } }
    else if (sel.kind === 'pickup') S.pickups.splice(sel.i, 1); else if (sel.kind === 'start') S.start = null;
    sel = null; refresh(); }
});
$('newBranch').onclick = () => { if (S.points.length < 3) { say('dessine d\'abord le tracé principal'); return; } push(); S.branches.push([]); curBranch = S.branches.length - 1; setMode('branch'); refresh(); };
$('valid').onclick = () => { if (S.points.length < 3) { say('au moins 3 points'); return; } push(); S.validated = true; refresh(); setMode('bonus'); say('circuit validé : place les bonus et le départ'); };
$('hpBonus').onclick = () => { push(); for (const [x, y, z] of info.hp_pickups) S.pickups.push({ x, y, z }); refresh(); };
$('clrBonus').onclick = () => { push(); S.pickups = []; refresh(); };
$('clrMain').onclick = () => { if (!confirm('Effacer le tracé principal ?')) return; push(); S.points = []; S.start = null; S.validated = false; sel = null; refresh(); };
$('clrBranch').onclick = () => { if (curBranch < 0 || !S.branches[curBranch]) { say('clique d\'abord sur une boule du chemin à effacer'); return; }
  push(); S.branches.splice(curBranch, 1); curBranch = -1; sel = null; refresh(); };
$('clrAll').onclick = () => { if (!S.branches.length || !confirm('Effacer tous les chemins secondaires ?')) return; push(); S.branches = []; curBranch = -1; sel = null; refresh(); };
// recalage + largeur réelle de la route (le couloir des IA de Blur = largeur de chaque point)
$('autoW').onclick = async () => {
  if (S.points.length < 3) { say('dessine d\'abord le tracé principal'); return; }
  say('recalage et mesure des largeurs…'); push();
  const fix = async (pts, closed) => (await (await fetch('/api/recenter', { method: 'POST',
    body: JSON.stringify({ points: pts.map(p => ({ x: p.x, z: p.z })), closed }) })).json()).map(p => ({ ...p, y: groundAt(p.x, p.z) }));
  S.points = await fix(S.points, true);
  for (let k = 0; k < S.branches.length; k++) if (S.branches[k].length > 1) S.branches[k] = await fix(S.branches[k], false);
  S.validated = false; sel = null; refresh();
  const W = S.points.map(p => p.w); say(`largeurs : ${Math.min(...W).toFixed(0)} à ${Math.max(...W).toFixed(0)} m (à revérifier puis « Valider le circuit »)`);
};

// ---------- enregistrement / construction ----------
function worldJson() {
  const total = lens(S.points).at(-1), r2 = v => Math.round(v * 100) / 100;
  const mp = { id: 'nfs_map_1', name: 'NFS Loop', laps: +$('o_laps').value, width: +$('o_width').value, auto_bridges: false, obstacles: false,
    scenery: { ships: false, cranes: false, landmarks: false, lamps: false, billboards: false, chevrons: false, signs: true, buildings: false, arch: true },
    points: S.points.map(p => ({ x: r2(p.x), z: r2(p.z), w: p.w })),
    branches: S.branches.filter(b => b.length > 1).map(b => { const a = arc(b[0]), e = arc(b.at(-1));
      return { from_m: Math.round(a), to_m: Math.round(e > a ? e : e + total), width: b[0].w, points: b.map(p => ({ x: r2(p.x), z: r2(p.z), w: p.w })) }; }),
    pickups: S.pickups.map(p => ({ kind: 'row', x: r2(p.x), z: r2(p.z) })) };
  if (S.start) mp.start_m = mp.finish_m = Math.round(arc(S.start));
  const stem = $('loc').value.split(/[\\/]/).pop().replace(/\.stm$/i, '');
  return { locations: [{ id: 'nfs_' + stem.toLowerCase(), name: 'NFS ' + stem, maps: [mp] }] };
}
async function save() {
  if (S.points.length < 3) { say('rien à enregistrer : dessine le circuit'); return false; }
  const old = await (await fetch('/api/world')).json();
  const w = worldJson();
  if (old) { w.locations[0].id = old.locations[0].id; w.locations[0].name = old.locations[0].name;
    Object.assign(w.locations[0].maps[0], { id: old.locations[0].maps[0].id, name: old.locations[0].maps[0].name }); }
  await fetch('/api/world', { method: 'POST', body: JSON.stringify(w) }); say('enregistré'); return true;
}
$('save').onclick = save;
$('build').onclick = async () => { if (!(await save())) return;
  await fetch('/api/options', { method: 'POST', body: JSON.stringify({ width: +$('o_width').value, grid_gap: +$('o_grid').value,
    radius: +$('o_radius').value, draw: +$('o_draw').value, zone: +$('o_zone').value, glow: +$('o_glow').value }) });
  const r = await (await fetch('/api/build', { method: 'POST' })).json(); say(r.error || 'construction lancée (suivi ci-dessus)'); };
$('install').onclick = async () => { const r = await (await fetch('/api/install', { method: 'POST' })).json(); say(r.error || 'installation lancée'); };

await locations();
setMode('look');
loadLocation();
</script>
